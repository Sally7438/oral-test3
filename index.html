<script>
var D=[
{c:"動機與轉換",q:"請用一分鐘做自我介紹。",k:["26年現場","角色限制","把直覺專業化"],a:"各位教授好，我是王彩鈴。我在國中任教二十六年多，當過導師、組長，也兼任認輔教師約八年。這些年我常看到，學生的成績或行為問題，背後其實是情緒和家庭的需求沒被接住。我用傾聽和圖卡陪過不少孩子，也清楚老師角色有限，遇到創傷或自傷風險時，我需要完整的理論、倫理和督導。所以我提早退休，想系統性地學習。我熟悉青少年、家長和學校系統，我的功課是把教師習慣轉成諮商專業，不急著給答案，陪當事人找到自己的方向。謝謝。"},
{c:"動機與轉換",q:"為什麼選在這個人生階段轉換，而不是繼續在教育體系？",k:["不是衝動","熱情與限制","需要正式訓練"],a:"這不是一時衝動。二十六年的現場，讓我看見自己的熱情，也看見限制。現在我的身體、時間和學習動機，都允許我完整投入，所以選擇提早退休。我已經修過心理實務班和當代諮商理論課程，但我很清楚，這些不能取代正式訓練，所以想回到研究所，有系統地學。"},
{c:"動機與轉換",q:"老師的陪伴和諮商的界線在哪裡？你怎麼避免用老師的方式進入諮商？",k:["給建議vs.跟隨","刻意放慢","督導檢視"],a:"老師常常是給建議、糾正、帶方向，諮商則是跟隨當事人的步調。我知道自己有這個習慣，所以進入諮商，我會刻意練習放慢，多反映、少指導。如果發現自己又想給答案，我會把它帶到督導裡檢視。教師的經驗是我的養分，但不是我的專業資格。"},
{c:"教學與輔導經驗",q:"有學生說你的一次談話改變了他，但你不記得說了什麼。你怎麼避免把這件事浪漫化？",k:["珍惜但不當證據","無法複製","學習檢核"],a:"這件事我很珍惜，但我不會把它當成我助人有效的證據。我其實不記得當時說了什麼，代表我沒辦法複製，也沒辦法檢核。這正是我想學習的地方：把憑直覺做的事，變成能被說明、被督導、被檢驗的專業。"},
{c:"教學與輔導經驗",q:"請分享一個印象深刻、但你覺得能力不足的個案。",k:["先處理行為","看到家庭系統","現在會怎麼做"],a:"我想到一位轉學的孩子，第二天就不願進教室，爸爸每天很強硬地送他到校。當時我先處理的是行為，讓他暫時待在輔導室，也安撫家長。但後來我意識到，不進教室只是表面，底下是轉學的適應焦慮，還有他和父親之間的衝突。我當時能做的有限，沒有真正處理到家庭。現在我會用系統的角度，把孩子、父親和學校一起看，這也是我想進修的原因。"},
{c:"教學與輔導經驗",q:"家長要求你透露孩子的諮商內容，你怎麼處理？",k:["同理家長","保密是信任基礎","安全例外"],a:"我會先同理家長的擔心，因為他是出於關心。然後說明，保密是讓孩子敢說話的基礎，所以我不會逐字透露內容。我會和孩子討論，哪些他同意讓家長知道，也會向家長說明孩子的整體狀況，以及家長可以怎麼支持。如果有安全風險，我會依法規和機構規範處理，並且事先讓孩子知道。"},
{c:"催眠與專業界線",q:"你有催眠證照，你如何看待催眠在諮商中的定位與風險？",k:["特殊技術","實證與倫理","督導下使用"],a:"催眠讓我對放鬆、暗示和身體經驗有興趣。但我把它視為需要更多訓練、倫理考量和實證支持的特殊技術，不是主要介入。未來我會依個案的需求、風險和證據來選擇方法，在督導下使用，也一定會先有知情同意。"},
{c:"催眠與專業界線",q:"如果個案要求你「幫我催眠，讓我不要焦慮」，你會怎麼回應？",k:["先了解需求","說明專業重點","同意後再討論"],a:"我會先謝謝他的信任，然後了解他想透過催眠得到什麼，焦慮背後發生了什麼事。我會說明，我目前的專業重點不是催眠，我們可以先從他的情緒和經驗談起。如果之後有適合的放鬆練習，也會在說明清楚、他同意之後，再一起討論。"},
{c:"自我覺察與學習",q:"你覺得自己最大的弱點是什麼？",k:["習慣給方向","練習放慢","督導與回饋"],a:"我長期是老師，習慣觀察、引導、給方向，有時會急著幫對方解決問題。到了諮商室，我需要練習放慢，不急著修復。我會透過督導、同儕回饋和自我覺察，持續檢視這個傾向。"},
{c:"自我覺察與學習",q:"你的碩士論文有些指標沒達顯著，後測還低於前測。你怎麼解讀？",k:["不硬說成功","多重原因","重視資料"],a:"我的研究有些指標沒達顯著，自我肯定和成就動機的後測還比前測低。我的解讀是，介入不一定有效，可能和樣本、介入時間、測量工具都有關，我不會硬說它成功。這讓我學到，要謙虛看待自己的方案，也更重視用資料檢視成效，這對未來做諮商評估很有幫助。"},
{c:"自我覺察與學習",q:"進入碩士班，你預期最大的學習挑戰是什麼？",k:["思維轉換","文獻與節奏","年齡是優勢"],a:"最大的挑戰是從教師思維轉到諮商思維，還有重新適應研究所的節奏，像是文獻量和案例討論。我的做法是提早安排讀書時間，主動請教同學和老師。我也會把年齡當成現場經驗的優勢，而不是不用學的理由。"},
{c:"諮商實務",q:"青少年拒學，你會怎麼做？",k:["先理解功能","系統合作","小步驟復學"],a:"我不會先處理要不要上學，而是先理解拒學對這個孩子的功能。我會分別和學生、家長、導師了解，評估情緒、睡眠、人際、課業壓力和家庭衝突，也留意霸凌或憂鬱焦慮。如果有自傷自殺或家暴，先處理安全。接著和孩子一起訂小步驟，像先到校半天、先見信任的老師。我在國中看過很多，拒學常常是學生、家庭、同儕共同維持的，所以我會做系統合作。"},
{c:"諮商實務",q:"不願就業、整天在家的青年，你會怎麼陪伴？",k:["放下標籤","先穩定生活","一小步"],a:"我會先放下「不工作就是不負責任」的標籤，理解不工作對他的意義。我會評估憂鬱、焦慮、社交恐懼、作息和家庭互動。目標不是逼他立刻找工作，而是先建立生活節奏，讓他重新經驗「我可以做一點事」。我也會問他：你想要什麼樣的生活？今天願意做的一小步是什麼？"},
{c:"諮商實務",q:"遇到網路成癮或遊戲成癮的個案，你會怎麼做？",k:["先評估功能損害","理解需求","替代經驗"],a:"我會先評估是不是已經失控，並影響到睡眠、學業和人際，再理解網路滿足了他什麼需要，可能是成就感、歸屬感，或逃避壓力。我不會沒收手機或羞辱他，而是一起記錄使用情境，找出替代的方式。如果合併明顯的憂鬱或焦慮，我會評估轉介精神科。"},
{c:"諮商實務",q:"個案透露有自殺念頭，你會怎麼處理？",k:["直接問","評估計畫與工具","依流程不獨扛"],a:"我會直接、平穩地問：你有沒有覺得活著很累，甚至想結束生命？接著了解想法的強度，有沒有計畫、工具、時間，過去的嘗試和支持系統。如果有具體計畫，或無法保證安全，就不讓他獨處，聯繫緊急聯絡人、安排精神科評估，並依自殺防治法和保密例外通報。我知道老師的陪伴有限，遇到風險要依流程處理，不能一個人扛。穩定之後，再慢慢處理絕望和孤單。"},
{c:"諮商實務",q:"個案有自傷行為，你會怎麼回應？",k:["先評估自殺風險","理解功能","安全計畫"],a:"我會先評估自殺風險，再去理解自傷對他的功能，可能是釋放強烈情緒、對抗麻木，或是說不出口的求助。我不會責備，也不會要求他保證永遠不再做。我會和他一起建立安全計畫，練習覺察情緒、延遲衝動，找到可以聯絡的人。之後再處理背後的家庭、羞愧和人際困難，並在督導下進行。"},
{c:"動機與轉換",q:"三年後如果發現諮商工作壓力大、收入不穩，或和想像不同，你會怎麼看？",k:["看見現實","先檢視落差","督導討論"],a:"我不會把這個決定當成一定要成功的賭注。我知道諮商有壓力，收入也可能不穩，所以是帶著這些現實來報考的。如果有落差，我會先看是哪一塊不如預期，是工作量、收入，還是我的期待，再和督導、同儕討論，而不是立刻否定自己。我選這條路，不是因為輕鬆，而是我願意為它學習。"},
{c:"動機與轉換",q:"你為什麼選高師大？",k:["地緣與經驗","理論實務並重","方向契合"],a:"有三個原因。第一，我在高雄長大，也在高師大修過教育學分班和心理學實務班，熟悉這裡的學習環境。第二，我上過貴所的當代諮商理論課程，覺得理論和實務並重，也重視專業倫理。第三，我想做青少年與學校相關的工作，這裡的訓練和我的方向很契合。"},
{c:"動機與轉換",q:"你想自由執業，也想做學校輔導與親師溝通，這兩個方向怎麼規劃？",k:["分階段","先實習考照","主軸青少年"],a:"這兩個方向需要的準備不同，所以我會分階段。先是畢業、實習和考照，這幾年把重心放在個案工作和督導。學校輔導和親師溝通，我會在實習階段就接觸，累積實務。自由執業等基礎穩了再開始。我的主軸是青少年，也關心中年轉換和退休適應，會看自己的訓練往哪裡長。"},
{c:"動機與轉換",q:"你畢業時年紀已經不小，執業年限有限，你怎麼看？",k:["誠實面對","不繞路","做得扎實"],a:"我清楚畢業、實習、考照要好幾年，執業的時間也不會像年輕人那麼長。所以我不想把時間拿去繞路，希望一開始就走專業、有督導的路。我會把重心放在我最熟悉的青少年與學校系統，以及中年轉換與退休適應。做得扎實，比做得久更重要。"},
{c:"動機與轉換",q:"如果這次沒有錄取，你會怎麼辦？",k:["接納失望","找回饋","持續進修"],a:"我會失望，但不會就此放棄。我會了解自己哪裡可以加強，繼續修課、累積經驗，再報考一次。我對這個方向的決心，不是只靠這一次的結果。"},
{c:"教學與輔導經驗",q:"學生為什麼願意主動找你？這個特質在諮商中有什麼優點與盲點？",k:["肯聽敢說","盲點：急著回應","留意被需要"],a:"我想是因為我肯聽，也敢直接說，不會一直說教，這是優點。盲點是我可能太快回應、太快給意見，讓學生覺得我就是答案。在諮商中，我要把這份親近感，變成穩定、有界線的關係，也要留意自己是不是想被需要。"},
{c:"教學與輔導經驗",q:"如果個案的情況很像你處理過的學生或家長，你怎麼避免套用舊經驗？",k:["經驗是假設","覺察反移情","督導討論"],a:"我會提醒自己，每個個案都是獨特的，我的經驗只是假設，不是答案。如果發現自己很快想說「我遇過類似的」，或對某位家長特別有情緒，我會先停下來覺察，再帶到督導討論。我也會多問、多確認，讓個案自己說他的故事。"},
{c:"教學與輔導經驗",q:"請用一個具體例子，說明你怎麼從成績或行為問題，看到背後的心理需求。",k:["看見行為背後","習得無助","先接住再談成績"],a:"我印象很深的是成績逐漸落後的學生。表面上是不寫功課、不專心，談下來才發現，他一再失敗，覺得自己不行，乾脆放棄。他需要的不是更多督促，而是先被看見努力，重新經驗「我可以做到一點事」。從那之後，我會先問行為背後的需求，再談成績。"},
{c:"催眠與專業界線",q:"你用過圖卡、卡牌，也接觸過身心靈的課程。這和諮商專業怎麼區分？",k:["媒介不是診斷","實證為主","督導下輔助"],a:"我用圖卡和卡牌，是因為它們可以幫學生說出不容易開口的事，像是一個過渡的媒介。但我知道這些工具沒有診斷或預測的功能，也不能取代專業評估。進入研究所後，我會以有證據、可檢核的方法為主，這些工具如果還要用，也要在督導和知情同意下，當作輔助。"},
{c:"催眠與專業界線",q:"你對精神分析和榮格有興趣，如何轉成可督導的實務能力？",k:["興趣不等於能力","個案概念化","督導檢驗"],a:"我的興趣來自對潛意識和內在世界的好奇。但我知道興趣不等於能力，所以我想透過系統性的課程、文獻和個案討論，學習個案概念化。例如把個案的行為，放進他的早期關係和防衛方式來理解，並在督導下檢驗，而不是只憑自己的詮釋。"},
{c:"自我覺察與學習",q:"你說自己有話直說，這在諮商中可能有什麼影響？",k:["直接是優點","先關係再面質","督導回饋"],a:"直接是我的優點，學生覺得我真誠。但在諮商中，太快面質，可能讓個案覺得被評價，關係還沒穩就受傷。所以我要練習先建立關係、先反映感受，等信任夠了，再用溫和的方式提出我的觀察。我也會請督導幫我看，我的直接什麼時候有幫助，什麼時候變成壓力。"},
{c:"自我覺察與學習",q:"你對自我探索很有心得，這對成為諮商師有什麼幫助？",k:["自我覺察","好奇不評價","個人經驗不是通則"],a:"這幾年的自我探索，讓我比較能覺察自己的情緒和習慣，也學會用好奇而不是評價看自己。這對陪伴個案很有幫助，因為我比較能容許個案有自己的步調。但我很清楚，個人經驗不能當成通則，也不能把我的信念放進諮商，我會在督導中持續檢視。"},
{c:"自我覺察與學習",q:"如果口試時太緊張，腦中一片空白，你會怎麼辦？",k:["先停一下","說出方向","承認限制"],a:"我會誠實地說：「這個問題很重要，請讓我想一下。」然後深呼吸，整理一兩個重點。如果還是不完整，我會說出我的想法方向，以及還需要學習的地方。我覺得在諮商中，願意承認限制，比硬撐完美更重要。"},
{c:"諮商實務",q:"物質成癮或藥酒癮的個案，你會怎麼處理？",k:["安全與不批判","戒斷醫療風險","動機式態度"],a:"成癮工作的第一原則，是安全和不批判的關係。我會評估使用的物質、頻率、戒斷風險、自殺風險和支持系統。酒精、安眠藥的戒斷有醫療風險，必要時轉介醫療或成癮防治單位。我會用動機式的態度，了解使用的功能，也一起規劃復發預防。成癮不只是意志力問題，常是在調節痛苦。"},
{c:"諮商實務",q:"課業、工作或人際焦慮的個案，你會怎麼做？",k:["先正常化","想法與行為","小步行動"],a:"我會先正常化焦慮，再評估它怎麼影響生活，來源可能是完美主義、害怕評價或家庭期待。我會幫個案辨識災難化想法和逃避行為，從小步驟開始，像拆解任務、放鬆練習。如果出現嚴重失眠、恐慌或自傷風險，就評估醫療轉介。我的研究處理過學習動機和自我效能，知道成績焦慮不是一句「加油」能解決的。"},
{c:"諮商實務",q:"失眠的個案，你會怎麼做？",k:["先評估類型","睡眠衛生與刺激控制","處理災難想法"],a:"失眠常是壓力、情緒和生活節奏交織的結果。我會先評估是入睡困難、睡不久還是早醒，也了解咖啡因、螢幕、藥物和生活事件。如果長期嚴重，或伴隨情緒低落，建議醫療評估。我也會用睡眠衛生和刺激控制，像固定起床時間、床只用來睡覺，再處理「睡不著明天就完了」的想法。"},
{c:"諮商實務",q:"個案對你的問題都不開口，也不看你，你怎麼辦？",k:["不強迫","反映與陪伴","非語言媒介"],a:"我不會強迫他開口。沉默可能是他保護自己的方式，所以我會先降低壓力，放慢節奏，不一直發問。我會溫和地說出我看到的：「你現在可能不太想說，沒關係，我可以陪你。」如果他願意，也可以用畫的、寫的，或搖頭點頭回應。我相信關係先於技巧，當他發現沉默不會被責備，才有機會慢慢開口。"},
{c:"專業取向",q:"從精神動力的角度，你怎麼理解青少年的拒學或自傷？",k:["分離與依附","情緒的外化","穩定抱持的關係"],a:"從精神動力的角度，拒學可能涉及分離焦慮和依附，孩子不是不想上學，是不敢離開安全的地方。自傷則可能是說不出口的情緒，用身體表達出來。我會想的是，他需要一個溫尼考特所說「足夠好」的環境，也就是穩定、能承接情緒、不急著修理他的關係。這是我還要深入學習的地方。"},
{c:"專業取向",q:"同理心和慈悲心有什麼差別？",k:["同理是理解與界線","慈悲是關懷","避免耗竭"],a:"同理是理解並感受對方的內在經驗，但保有「我」和「他」的界線。慈悲則是在理解之後，帶著關懷，希望他的痛苦能減輕。過度的情緒共感，可能讓助人者耗竭，所以我會練習在同理之中保持穩定，讓關懷能持續。"},
{c:"專業取向",q:"你怎麼看待創傷與復原？",k:["不只是事件","安全穩定優先","不強求成長"],a:"我認為創傷不只是事件本身，而是個人在事件中的反應，它會動搖安全感和對世界的信任。修復的第一步是安全與穩定，接著是處理記憶和哀悼，最後是重新與人連結，這是赫曼的三階段觀點。每個人的復原路徑不同，創傷後成長不是必然，我不會要求個案一定要「變好」。"},
{c:"動機與轉換",q:"教學到退休，你體會到什麼？為什麼一退休就想讀諮商所？畢業後有什麼規劃？",k:["冰山一角","有心無力","校園與親職"],a:"這二十六年，我最大的體會是，成績只是冰山一角，水面下的心理狀態和家庭支持，才是孩子能不能好好長大的關鍵。我常看到被貼上叛逆或不認真標籤的孩子，背後是家庭變動或同儕壓力。但身為導師，我被進度和行政追著跑，有心卻很難深入陪伴。所以退休後，我想用更專業的方式補足這一塊。畢業後，我希望回到校園協助適應困難的孩子，也辦親職工作坊，陪伴焦慮的父母。我會用空杯的心態好好學習。"},
{c:"動機與轉換",q:"你在國中教書二十六年，處理過學生與親師的問題，這和你現在讀諮商所有什麼關聯？",k:["家庭系統","角色限制","直覺理論化"],a:"這二十六年，我處理過不少青少年危機和親師衝突，也看到孩子的問題常牽動整個家庭。但受限於導師的角色，我多半只能做常規管理和危機處理，沒有足夠的時間和專業，去陪伴深層的歷程。所以我想透過研究所的訓練，把累積的實務直覺，變成有理論、可檢核的能力。"},
{c:"自我覺察與學習",q:"你過去的校園輔導經驗很成功，會不會成為做諮商時的盲點？你怎麼調整？",k:["急著解決","角色邊界","督導檢視"],a:"我覺得有兩個盲點。第一，我習慣快速解決問題，可能太急著找方法，忽略個案更深的痛苦。第二是邊界。過去我可以主動協調環境，但諮商師和個案通常只有每週一小時，我不能習慣當環境的拯救者，以免造成依賴。我會刻意練習陪著個案的混亂和痛苦，進度慢下來也可以，並透過督導檢視自己，是不是又掉回老師的慣性。"},
{c:"自我覺察與學習",q:"請簡述你這幾年學習身心靈的心得。",k:["接納情緒","自我覺察","個人經驗非通則"],a:"這幾年我最大的收穫，是學會接納自己的情緒，也更能活在當下。我把它看成一種自我覺察的練習，而不是玄學。我發現情緒被允許，才會流動，遇到困難，先回頭看自己的反應。我也很清楚，這是我的個人經驗，不是通則，在諮商裡我會放下自己的信念，跟隨個案的經驗。"},
{c:"專業取向",q:"在工作或人際中，你怎麼避免同理心過勞？",k:["同理加界線","不當拯救者","自我照顧與督導"],a:"同理心過勞，是過度吸收別人的情緒而耗竭。我會做三件事。第一，保持同理，也維持界線，知道那是對方的經驗。第二，不把自己當拯救者，陪伴不等於替他解決問題。第三，用呼吸和身體感覺，把自己拉回當下。同時我會善用督導和自我照顧，讓自己能長期助人。"},
{c:"專業取向",q:"你怎麼把同理心轉化成不帶壓力的慈悲心？",k:["從共感到關懷","有界線行動","接受限制"],a:"我會把「我也好痛」，轉成「我希望他好起來」，用關懷代替被情緒淹沒。行動上量力而為，提供有界線的協助。我也接受，有些事我無法控制，盡力陪伴，但不執著對方一定要改變。"},
{c:"專業取向",q:"請說明創傷、創傷修復與創傷後成長，以及相關理論。",k:["事件與反應","身體認知關係敘事","三階段"],a:"創傷不只是事件，而是個人對極度壓力的反應。理論上，多重迷走神經理論看身體的安全感，認知取向處理卡住的信念，依附理論強調關係中的修復，敘事治療幫人重寫生命故事。Herman 的三階段是安全穩定、回憶哀悼、重新連結。創傷後成長，是與創傷掙扎之後的轉變，但不是每個人都會有，也不能強求。"},
{c:"專業取向",q:"請簡述精神分析、行為、人本、認知四大學派的人性觀。",k:["精神分析決定論","行為環境塑造","人本向上","認知詮釋"],a:"精神分析傾向決定論，重視潛意識和早年經驗。行為主義強調環境，人是被學習和制約塑造的。人本主義認為人性向上，有自我實現的潛能。認知學派看人是主動的資訊處理者，想法和詮釋會影響情緒與行為。"},
{c:"專業取向",q:"請說明阿德勒、個人中心、現實治療、家庭系統的人性觀。",k:["阿德勒目標與社會興趣","個人中心自我實現","現實治療選擇","家庭系統關係"],a:"阿德勒認為人是社會性的，由未來的目標驅動，追求克服自卑、邁向卓越。個人中心認為人天生有自我實現的傾向，是值得信任的。現實治療認為行為是選擇，是為了滿足生存、愛與歸屬、權力、自由和樂趣五個需求。家庭系統把人放進關係裡，個人的行為是家庭動力的一部分，互動改變，個人也會跟著改變。"},
{c:"動機與轉換",q:"請做三分鐘的自我介紹。",k:["我是誰","轉折個案","學習與研究","我的承諾"],a:"各位教授好，我是王彩鈴。我在國中任教二十六年多，當過導師、教學組長、設備組長，也兼任認輔教師約八年。\n在現場，我看過許多學生的課業或行為問題，背後其實是情緒和家庭的需求沒被接住。我印象很深的是一位轉學的孩子，轉學第二天就不願進教室，爸爸每天用很強硬的方式送他到校。當時我先處理行為，讓他暫時待在輔導室，也安撫家長。後來我才意識到，不進教室只是表面，底下是適應的焦慮，還有他和父親之間的衝突。我有心，卻沒有足夠的訓練，去處理家庭這一塊。\n也因為這樣，我自費學習溝通技巧、圖卡，陪學生把說不出口的話說出來，也學了催眠。但我很清楚，這些不能取代正式的諮商訓練，所以我把它們放在倫理、實證與督導之下看待。我也修過高師大的心理學實務班和當代諮商理論課程，對精神分析和榮格有興趣，想把這份好奇，轉成可以被督導的能力。\n我的在職碩士研究處理學習動機，結果並不全然顯著，這讓我學到，介入不一定有效，要謙虛，也要看資料。\n我提早退休，是因為現在身體、時間和學習動機，都允許我完整投入。我知道自己習慣當老師，會急著給建議，進入諮商，我要練習放慢，陪伴當事人找到自己的方向。我希望畢業後從青少年與學校出發，也關心中年轉換與退休適應。謝謝教授。"},
{c:"諮商實務",q:"追問：個案說「我沒事，只是隨便說說」，你怎麼辦？",k:["認真看待","再確認","保守評估"],a:"我不會因為他說沒事，就放下這件事。我會回應他：我聽到你說隨便說說，但我還是想了解，你說這句話之前發生了什麼。接著再問，有沒有想結束生命的念頭，有沒有計畫。我會認真看待，不批評。如果還是不確定，我會用保守的方式做風險評估，並和督導討論。"},
{c:"諮商實務",q:"追問：個案要你保證，不告訴任何人他想自殺，你怎麼辦？",k:["不承諾絕對保密","說明限制","邀請參與"],a:"我不會答應。我會在一開始就說明，保密有例外，涉及生命安全時，我必須找人協助。我會溫和地告訴他，我在乎他的安全，也邀請他一起決定，要讓誰知道、怎麼說，盡量保持他的參與。需要通報時，我會依法規和機構規範處理，並事先讓他知道。"},
{c:"諮商實務",q:"追問：個案給你看他手上的傷口，你第一時間怎麼反應？",k:["穩住自己","先看醫療安全","感謝信任"],a:"我會先穩住自己，不驚慌，不責備，也不表現得過度震驚。我會謝謝他願意讓我知道，確認傷口需不需要醫療處理，再問他當下的感受，接著評估自殺風險。我想讓他知道：我看到了你的痛，我們一起想辦法。"},
{c:"專業取向",q:"你對克萊茵或溫尼考特有什麼認識？",k:["克萊茵內在客體","溫尼考特抱持","督導下運用"],a:"我還在學習階段，目前的理解是，克萊茵關注嬰兒早期的幻想和內在客體關係，像是好與壞客體的分裂，以及投射性認同。溫尼考特強調足夠好的母親、抱持的環境和過渡客體，孩子被穩定地承接，才能發展出真實的自我。這些概念對我理解青少年的依附和情緒很有幫助，但我知道，要在督導下才能運用。"},
{c:"專業取向",q:"個案對你特別生氣，或特別依賴你，你怎麼理解？",k:["移情","反移情","帶到督導"],a:"我會把它看成關係中浮現的重要訊息。可能是個案把對重要他人的感受，帶到我這裡，這是移情。我也會覺察自己的反應，是不是被引出老師的角色，想去安撫或糾正，這是反移情。我不會急著反擊或安撫，而是先看見，再帶到督導討論，在適當的時機和個案一起探索。"},
{c:"諮商實務",q:"如果個案一開始狀況就很嚴重（高自殺風險、精神症狀、嚴重成癮），你會怎麼回應？",k:["先評估安全","跨專業合作","諮商持續"],a:"考量個案目前的狀況，我會先評估風險，確保他的安全。這已經超出單靠諮商能處理的範圍，所以我會和精神科醫師合作，必要時也聯繫社政、學校輔導室或危機處理單位，一起建立支持網絡。我會依法規和機構規範處理通報，也會向個案說明為什麼這麼做，讓他參與決定。狀況穩定之後，我會持續提供心理諮商，處理背後的議題，並在督導下定期檢視。"},
{c:"諮商實務",q:"什麼情況下，你會轉介或和精神科合作？",k:["風險高","精神症狀","超出訓練"],a:"有幾種情況。第一，自傷自殺風險高，或有具體計畫。第二，出現幻聽、妄想、現實感混亂等精神症狀。第三，憂鬱、焦慮、失眠嚴重到影響基本功能，或需要藥物評估。第四，物質戒斷有醫療風險。還有，當個案的議題超出我的訓練範圍，我也會坦誠轉介。轉介不是結束關係，我會向個案說明，並視情況和醫師持續合作。"},
{c:"諮商實務",q:"個案涉及家暴、兒虐或性侵，你會怎麼處理？",k:["先安全","責任通報","告知與合作"],a:"我會先確認個案當下的安全，再依法規辦理責任通報，向家暴或兒少保護的社政單位求助。我會事先向個案說明保密的限制和通報的原因，盡量讓他理解、參與，維持信任關係。後續我會和社工、學校或醫療單位合作，我負責心理支持與穩定，不單獨處理整個案件，也會把過程帶到督導。"}

var FX={"吊橋效應":"一起搭完雲霄飛車後，覺得身旁的人特別有魅力。","否認":"得知自己要留級，卻說「一定是搞錯了」。","壓抑":"對某件難過的事「完全想不起來」。","投射":"自己對同學生氣，卻說「是他一直討厭我」。","合理化":"考差了說「那科本來就不重要」。","反向形成":"很討厭某人，卻對他格外殷勤。","置換":"被老師罵後，回家對弟弟發脈氣。","昇華":"把憤怒化為運動或創作。","退化":"面對考試壓力，又像小時候一樣黏著媽媽、鬧脈氣。","知性化":"談到父母離婚時，只談法律和統計，不談難過。","分裂":"昨天說「老師最好」，今天說「老師最差」。","依附理論":"孩子在陜生環境中，先回頭看媽媽在不在。","安全基地":"孩子敢玩玩具，因為知道媽媽在旁邊；諮商師也可以是這樣的基地。","陜生情境":"媽媽離開再回來，孩子反應不同：安心、黏人，或不理人。","安全型依附":"孩子哭過後被抱著，很快就回去玩。","焦慮矛盾型依附":"朋友晚一點回訊息，就慢慢宣洩不安、反覆確認「你還在嗎」。","逃避型依附":"難過時不找人，說「我沒事，自己可以」。","混亂型依附":"一面想靠近照顧者，又一面害怕而退縮。","內在運作模型":"「我不值得被愛、別人靠不住」，影響他如何看待老師和同學。","修正性情感經驗":"個案預期被批評，卻在諮商室被接納，逐漸修正舊的判斷。","月暈效應（光環效應）":"老師覺得成績好的學生品行一定也好，卻忽略了他的情緒困擾。","達克效應":"剛學一點諮商技巧，就覺得什麼個案都能處理；資深的人反而更謙虛。","煤氣燈效應":"「你太敏感了，我根本沒說過那句話」，讓對方慢慢不再相信自己。","斯德哥爾摩症候群":"長期被控制的人，反而替控制他的人辨護。","比馬龍效應":"老師相信某學生有潛力，常鼓勵他，他的成績真的進步了。","霍桑效應":"學生知道老師在記錄上課專心度，當天特別認真。","安慰劑效應":"服用沒有藥效的糖錠，卻覺得症狀緩解了。","旁觀者效應":"教室裡有人被欺負，全班都看著，卻沒人出聲。","確認偏誤":"認定某學生愛搗亂，就只注意到他犯錯的時候。","錨定效應":"先聽到「他很難搭」，之後見到他就用這個標籤看他。","巴納姆效應":"看性格測驗說「你有時外向，有時內向」，卻覺得很準。","冒名頂替症候群（冒牌者症候群）":"取得資格後，仍覺得「我只是運氣好」。","習得無助":"長期被否定的學生，後來連簡單的題目也不試了。","認知失調":"明知熟夜不好，卻告訴自己「我這樣比較有效率」。","基本歸因錯誤":"看到學生遲到就說他懶，沒想到他得先照顧弟妹。","自利偏差":"考好是「我努力」，考差是「老師出太難」。","從眾效應":"明知答案不同，看到大家都選同一個，也跟著選。","社會懈怠":"小組報告時，有人覺得「反正有別人做」。","社會助長":"熟練的歌在人前唱得更好，剛學的動作在人前卻容易出錯。","蔡格尼克效應":"沒說完的話一直放在心上，和完形的「未竟事務」相呼應。","破窗效應":"教室的垃圾沒人撿，後來越來越多人隨手亂丟。","沉沒成本效應":"「都修了好幾年課，不繼續好像太浪費」。","負面偏誤":"十句稱讚很快忘了，一句批評卻記很久。","白熊效應":"告訴自己「不要想前任」，反而一直想到。","覺察":"學生說「我現在胸口好悶」，就是在留意當下的身體感受。","未竟事務":"一直氣被誤會的事，卻從沒說出口，一提到就很激動。","圖形與背景":"考前焦慮時，腦中只剩「會不會考砸」，其他事都退到背景。","空椅":"請學生對想像中坐在空椅上的老師，說出沒說的話。","療效因子":"小團體中有人說「謝謝你讓我不孤單」，就是普遍性與凝聚力在發揮作用。","普遍性":"學生在團體發現「原來你也被爸媳拿去跟別人比」。","此時此地":"領導者說「剛才大家沉默時，我有點緊張，你們呢？」","替身":"輔角站在主角身後，說出「其實我很怕被丟下」。","偏執—分裂心位":"孩子一下覺得老師全好，一下又覺得老師全壞。","憂鬱心位":"孩子能說「老師有時很凶，但也是在乎我」。","投射性認同":"學生不斷激怒老師，老師真的生氣，彷彿證明了「大人都討厭我」。","足夠好的母親":"照顧者不完美，但孩子哭的時候多半有回應。","抱持環境":"輔導室不急著催孩子進教室，先穩定地接住他。","過渡客體":"孩子上學時緊抓著一條小毛毯或玩偶。","真自體與假自體":"學生在老師面前很乖巧，其實很不想上學。","四個終極關懷":"畢業前學生問「讀這些書到底有什麼意義？」","存在焦慮":"面對升學抽擇時，覺得「怎麼選都可能後悔」。","悖論意向":"失眠者刻
